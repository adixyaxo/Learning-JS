<!DOCTYPE html>
<!-- Simple demo page for DOM manipulation exercises -->
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DOM Manipulation Demo</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="container">
    <!-- First block: interactive examples -->
    <section class="div1">
      <h1 class="heading">Interactive heading</h1>
      <p id="para">This paragraph will be changed by the script.</p>
      <div class="controls">
        <button id="myButton">Toggle highlight</button>
        <button id="myButton2">Insert reminder</button>
      </div>
    </section>

    <!-- Second block: static example for comparison -->
    <section class="div1">
      <h1>Static heading</h1>
      <p>Static paragraph for comparing traversal and selection.</p>
      <button class="dummy">No script attached</button>
    </section>
  </main>

  <script src="script.js"></script>
</body>

</html>
